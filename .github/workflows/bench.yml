name: Benchmarks

# The measured comparison of PLAN 11: report-err against anyhow, eyre,
# error-stack, and Box<dyn Error> on Linux x86_64, Windows x86_64, and Linux
# aarch64. Ratios come from the same run on the same runner, so the runner's
# own speed cancels out. On a pull request the base branch and the head are
# measured in turn, three times each, on the same runner, and the gate fails
# when one of report-err's own times is more than 5% (and 1 ns) slower than
# the base's in all three rounds (D-065): a shared runner's noise does not
# repeat three times. A ratio that drifts more than 5% from
# benches/baseline.json is reported as a warning.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmarks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Environment
        shell: bash
        run: |
          {
            echo "### ${{ matrix.platform }}: environment"
            echo '```'
            rustc -vV
            if command -v lscpu > /dev/null; then
              lscpu | grep -E 'Model name|^CPU\(s\)|Architecture'
            else
              powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; 'Logical CPUs: ' + (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors"
            fi
            uname -sr
            echo '```'
          } | tee env.md
          cat env.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run
        shell: bash
        run: |
          unset RUST_BACKTRACE RUST_LIB_BACKTRACE
          # Results restored from the cache are never compared.
          rm -rf benches/target/criterion
          cargo bench --manifest-path benches/Cargo.toml -- --warm-up-time 1 --measurement-time 3 --noplot
      - name: Base and head in turn
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          unset RUST_BACKTRACE RUST_LIB_BACKTRACE
          head="$(git rev-parse HEAD)"
          # Both sides are built from one worktree path, base first and then
          # head, so the paths and package ids compiled into them are the
          # same: built from two paths, identical sources gave binaries laid
          # out differently, and the gate measured a row 6% slower in every
          # round with no code changed (D-086).
          git worktree add ../ab "origin/${{ github.base_ref }}"
          # Only the same suite measures the same thing (D-058).
          if ! cmp -s benches/benches/compare.rs ../ab/benches/benches/compare.rs; then
            echo "The base branch has another benchmark suite; nothing to compare."
            exit 0
          fi
          # The benchmark executables of one side, built in its own target
          # directory, so neither rebuilds the other.
          executables() {
            cargo bench --manifest-path benches/Cargo.toml --no-run --message-format=json 2>/dev/null | python -c "
          import json, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get('reason') == 'compiler-artifact' and m.get('executable') and 'bench' in m['target']['kind']:
                  print(m['executable'])"
          }
          (cd ../ab && CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" executables) > base.txt
          git -C ../ab checkout --quiet --detach "$head"
          (cd ../ab && CARGO_TARGET_DIR="$RUNNER_TEMP/head-target" executables) > head.txt
          # report-err's own rows: its side of each comparison, and the
          # groups only it has. No leading `/`: Git Bash on Windows rewrites
          # such an argument into a path before a program sees it.
          only='report-err|^(boundary|codes|collect|hook)/'
          export MSYS_NO_PATHCONV=1
          export CARGO_TARGET_DIR="$RUNNER_TEMP/alternate"
          for round in 1 2 3; do
            for side in base head; do
              while read -r exe; do
                command -v cygpath > /dev/null && exe="$(cygpath -u "$exe")"
                "$exe" --bench "$only" --warm-up-time 1 --measurement-time 3 --noplot --save-baseline "$side$round" > /dev/null
              done < "$side.txt"
            done
          done
          touch alternated
      - name: Run B18 with mimalloc
        if: matrix.platform != 'windows-x86_64'
        shell: bash
        run: cargo bench --manifest-path benches/Cargo.toml --features mimalloc --bench extra -- contention --warm-up-time 1 --measurement-time 3 --noplot
      - name: Ratios and the gate
        shell: bash
        run: |
          gate=()
          if [ -f alternated ]; then gate=(--alternating "$RUNNER_TEMP/alternate/criterion" 3); fi
          python benches/ratios.py benches/target/criterion ${{ matrix.platform }} --baseline benches/baseline.json --write-baseline measured.json "${gate[@]}" | tee ratios.md
          cat ratios.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.platform }}
          path: |
            env.md
            ratios.md
            measured.json
            benches/target/criterion/**/new/*.json

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
        rust: [stable, "1.81"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Build examples
        run: cargo build --examples
      # Every mode: a doc link to a feature-gated item breaks only when that
      # feature is off, and the `no_std` surface has its own docs.
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (no default features)
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  no_std:
    name: no_std (thumbv7em-none-eabihf / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.81"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build without std
        run: cargo build --no-default-features --target thumbv7em-none-eabihf

  miri:
    name: Miri (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Stacked Borrows
            flags: "-Zmiri-strict-provenance"
          - model: Tree Borrows
            flags: "-Zmiri-strict-provenance -Zmiri-tree-borrows"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri setup
        run: cargo miri setup
      # Unit and integration tests; the doc tests read files, which Miri
      # isolates, and exercise no unsafe code of their own.
      - name: Miri test (default features)
        run: cargo miri test --lib --tests
        env:
          MIRIFLAGS: ${{ matrix.flags }}
      - name: Miri test (no default features)
        run: cargo miri test --lib --tests --no-default-features
        env:
          MIRIFLAGS: ${{ matrix.flags }}

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `--target` keeps build scripts out of the sanitizer.
      - name: Test under AddressSanitizer
        run: cargo test --lib --tests --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address -D warnings"
          ASAN_OPTIONS: "detect_leaks=1"

  panic-abort:
    name: panic = "abort"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # E-96: under `panic = "abort"` the boundary catches nothing and the
      # process aborts (SIGABRT, status 134) after saying so.
      - name: Boundary aborts
        run: |
          set +e
          cargo run --example panic_boundary > out.txt
          status=$?
          set -e
          cat out.txt
          grep -qx 'PANICS_CAUGHT=false' out.txt
          ! grep -q 'caught:' out.txt
          test "$status" -eq 134
        env:
          RUSTFLAGS: "-C panic=abort"

  fuzz:
    name: Fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz
            soak
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: Format and Clippy (fuzz and soak)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path soak/Cargo.toml -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
          cargo clippy --manifest-path soak/Cargo.toml -- -D warnings
      # cargo-fuzz builds with AddressSanitizer by default. The 24-hour runs
      # of each release happen outside CI (docs/SECURITY.md); this catches a
      # target that no longer builds or fails at once.
      - name: Run each target
        run: |
          for target in ops display_adversary; do
            cargo fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=60 -rss_limit_mb=4096
          done
          cargo fuzz run --fuzz-dir fuzz limits -- -max_total_time=60 -rss_limit_mb=4096 -fork=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  benches:
    name: Benchmarks (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Format
        run: cargo fmt --manifest-path benches/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path benches/Cargo.toml --benches -- -D warnings
      - name: Build
        run: cargo bench --manifest-path benches/Cargo.toml --no-run

  loom:
    name: Loom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Loom models
        run: cargo test --release --lib
        env:
          RUSTFLAGS: "--cfg loom -D warnings"
          LOOM_MAX_PREEMPTIONS: "3"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo package

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check

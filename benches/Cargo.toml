# Benchmarks for report-err (PLAN 11). Not published and not part of the
# crate's build: a separate package, so the MSRV jobs never build criterion.
# Run: cargo bench --manifest-path benches/Cargo.toml
[package]
name = "report-err-benches"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
report-err = { path = ".." }
define-err = "0.9"
anyhow = "=1.0.104"
eyre = "=0.6.14"
error-stack = "=0.8.0"
mimalloc = { version = "0.1", optional = true, default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[features]
# B18 with mimalloc as the global allocator (needs a C compiler).
mimalloc = ["dep:mimalloc"]

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "extra"
harness = false

[[bench]]
name = "backtrace"
harness = false

[[bench]]
name = "rd14"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
